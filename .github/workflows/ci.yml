name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages apps scripts
      - name: Test
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: War Room build
        working-directory: apps/war-room
        run: |
          npm install
          npm run build
